schema_version: 1

context:
  name: openkimmodels
  version: 2021.01.28

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://s3.openkim.org/archives/collection/openkim-models-${{ version|replace('.', '-') }}.txz
  sha256: 8824adee02ae4583bd378cc81140fbb49515c5965708ee98d856d122d48dd95f

build:
  number: 1
  skip: win

requirements:
  build:
  host:
  run:
    - openkim-models

tests:
  - script:
      - kim-api-collections-management list

about:
  license: CDDL-1.0
  license_file: LICENSE
  summary: All OpenKIM Models compatible with kim-api
  description: |
    All OpenKIM Models compatible with kim-api.
  homepage: https://openkim.org
  repository: https://openkim.org
  documentation: https://openkim.org/doc/usage/obtaining-models/

extra:
  recipe-maintainers:
    - jan-janssen
    - ellio167
